name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test converter and GUI
        run: |
          python -m unittest discover -s tests -v
          python app.py --smoke-test
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name ExcelToPrismStudio --collect-all openpyxl --collect-all xlrd app.py
      - name: Test packaged application and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Launch($Exe) {
            $p = Start-Process -FilePath $Exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'GUI startup timed out' }
            if ($p.ExitCode -ne 0) { throw "GUI startup failed: $($p.ExitCode)" }
          }
          Test-Launch "$pwd\dist\ExcelToPrismStudio\ExcelToPrismStudio.exe"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is missing from the runner' }
          & $iscc installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setup = (Resolve-Path 'dist/installer/Excel_to_Prism_Studio_Setup_1.2.0.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'Prism Studio Installed'
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
          Test-Launch "$target\ExcelToPrismStudio.exe"
          $p = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path "$target\ExcelToPrismStudio.exe") { throw 'Uninstall left the application executable' }
      - uses: actions/upload-artifact@v4
        with:
          name: Excel-to-Prism-Studio-Windows-Installer
          path: dist/installer/Excel_to_Prism_Studio_Setup_1.2.0.exe
          if-no-files-found: error
